[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "codex-switch"
version = "0.2.2"
description = "Local desktop tool for switching Codex API profiles."
requires-python = ">=3.11"
dependencies = [
  "ttkbootstrap>=1.10,<2",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
codex_switch = ["assets/*"]
